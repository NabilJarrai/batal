name: Deploy Batal Academy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: |
          echo "IMAGE_NAME_FRONTEND=$(echo ${{ env.REPO_NAME }}-frontend | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_BACKEND=$(echo ${{ env.REPO_NAME }}-backend | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          no-cache: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://batal-academy.com/api
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      # Plain ssh rather than appleboy/ssh-action so a failed connection can be
      # told apart from a failed deploy: ssh exits 255 only when the connection
      # itself fails. The VPS intermittently times out on port 22 while builds
      # stay green, which used to leave production on the old version until
      # someone re-ran the job. Only 255 is retried; a real deploy failure is not.
      - name: Deploy to Development Server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_SCRIPT: |
            ENV="production"
            DOMAIN="batal-academy.com"
            PROJECT_DIR="/opt/batal-production"

            echo "Deploying to $DOMAIN"

            # Create project directory if it doesn't exist
            sudo mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR || exit 1

            # Clone or pull latest changes
            if [ ! -d ".git" ]; then
              sudo git clone https://github.com/NabilJarrai/batal.git .
            fi

            sudo git fetch origin
            sudo git checkout master
            sudo git reset --hard origin/master
            sudo git pull origin master

            # Verify required files exist
            if [ ! -f "docker-compose.deploy.yml" ]; then
              echo "❌ docker-compose.deploy.yml not found!"
              ls -la docker-compose*
              exit 1
            fi

            # Use deployment configuration
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.deploy.yml"
            IMAGE_TAG="master"

            # Create environment file from secrets
            sudo tee .env > /dev/null << EOF
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
            MINIO_ROOT_USER="${{ secrets.MINIO_ROOT_USER }}"
            MINIO_ROOT_PASSWORD="${{ secrets.MINIO_ROOT_PASSWORD }}"
            JWT_SECRET="${{ secrets.JWT_SECRET }}"
            MAIL_USERNAME="${{ secrets.MAIL_USERNAME }}"
            MAIL_PASSWORD="${{ secrets.MAIL_PASSWORD }}"
            FRONTEND_URL="https://$DOMAIN"
            FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:$IMAGE_TAG"
            BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:$IMAGE_TAG"
            DOMAIN="$DOMAIN"
            EOF

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest images
            sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:$IMAGE_TAG
            sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:$IMAGE_TAG

            # Stop and remove containers to force image refresh
            sudo docker compose $COMPOSE_FILES down || true
            sudo docker system prune -f

            # Deploy with docker compose
            sudo docker compose $COMPOSE_FILES up -d

            # Wait for services to start
            echo "Waiting for services to start..."
            sleep 10

            # Verify deployment
            echo "Verifying deployment..."

            # Check container status
            for i in {1..6}; do
              NOT_RUNNING=$(sudo docker compose $COMPOSE_FILES ps --format "table {{.Name}}\t{{.Status}}" | grep -v "STATUS" | grep -v "Up" | head -5)
              if [ -n "$NOT_RUNNING" ]; then
                if [ $i -eq 6 ]; then
                  echo "❌ DEPLOYMENT FAILED: Containers failed to start"
                  echo "Non-running containers:"
                  echo "$NOT_RUNNING"
                  sudo docker compose $COMPOSE_FILES logs --tail=50
                  exit 1
                fi
                echo "Attempt $i/6: Waiting for containers to start..."
                sleep 10
              else
                echo "✅ All containers are running"
                break
              fi
            done

            # Test backend health
            echo "Testing backend health..."
            for i in {1..30}; do
              if curl -f http://localhost:8080/api/actuator/health >/dev/null 2>&1 || curl -f http://localhost:8080/api/health >/dev/null 2>&1; then
                echo "✅ Backend is healthy"
                break
              elif [ $i -eq 30 ]; then
                echo "❌ Backend health check failed after 60 seconds"
                echo "Container status:"
                sudo docker compose $COMPOSE_FILES ps
                echo "Backend logs:"
                sudo docker compose $COMPOSE_FILES logs backend --tail=50
                exit 1
              else
                echo "Attempt $i/30: Backend not ready yet..."
                if [ $((i % 5)) -eq 0 ]; then
                  echo "Checking container status..."
                  sudo docker compose $COMPOSE_FILES ps backend
                fi
                sleep 2
              fi
            done

            # Test frontend
            echo "Testing frontend..."
            for i in {1..15}; do
              if curl -f http://localhost:3000 >/dev/null 2>&1; then
                echo "✅ Frontend is healthy"
                break
              elif [ $i -eq 15 ]; then
                echo "❌ Frontend health check failed"
                sudo docker compose $COMPOSE_FILES logs frontend --tail=20
                exit 1
              else
                echo "Attempt $i/15: Frontend not ready yet..."
                sleep 2
              fi
            done

            # Set up nginx configuration
            sudo cp nginx-batal.conf /etc/nginx/sites-available/batal
            sudo ln -sf /etc/nginx/sites-available/batal /etc/nginx/sites-enabled/

            # Get SSL certificate if it doesn't exist
            if [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
              sudo certbot --nginx -d $DOMAIN --non-interactive --agree-tos --email ${{ secrets.ADMIN_EMAIL }}
            fi

            # Test and reload nginx
            sudo nginx -t && sudo systemctl reload nginx

            # Clean up old images
            sudo docker image prune -f

            # Final status
            echo "🎉 DEPLOYMENT SUCCESSFUL!"
            echo "📊 Final status:"
            sudo docker compose $COMPOSE_FILES ps

            echo "✅ Application accessible at: https://$DOMAIN"
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key

          # Sent base64-encoded as the command rather than on stdin, so nothing
          # in the script can swallow the rest of it by reading stdin.
          encoded=$(printf '%s' "$DEPLOY_SCRIPT" | base64 -w0)

          for attempt in 1 2 3 4; do
            echo "SSH attempt $attempt/4"
            status=0
            ssh -n -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$VPS_USER@$VPS_HOST" "bash -c \"\$(echo $encoded | base64 -d)\"" || status=$?
            if [ "$status" -ne 255 ]; then
              exit "$status"
            fi
            echo "Could not reach the server (ssh exit 255)"
            [ "$attempt" -lt 4 ] && sleep 20
          done
          echo "❌ Gave up after 4 attempts to reach the server"
          exit 1
